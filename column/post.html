<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>칼럼 · 토토의 집</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="column.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html"><span class="brand-mark">T</span><span>토토의 집</span></a>
  <nav class="nav" aria-label="주요 메뉴">
    <a href="../index.html">홈</a>
    <a href="index.html">칼럼</a>
  </nav>
  <div class="top-actions">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="화면 테마 바꾸기">◐</button>
  </div>
</header>

<main class="column-main column-detail-main">
  <a class="column-back" href="index.html">← 칼럼 목록으로</a>
  <article id="columnDetail" class="column-detail"></article>
</main>

<script type="module">
  import { initColumnAuth, initColumnDetail } from "./column.js";
  initColumnAuth();
  initColumnDetail();
  const root = document.documentElement;
  const saved = localStorage.getItem("toto-theme");
  if (saved) root.dataset.theme = saved;
  document.getElementById("themeToggle")?.addEventListener("click", () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next; localStorage.setItem("toto-theme", next);
  });
</script>
</body>
</html>
